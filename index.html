<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SOL. 30</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 배치: 왼쪽 좁은 단은 주변, 가운데는 장소 이름 아래 나레이션과 작은 버튼 묶음, 오른쪽은 테두리 상자 하나에 상태, 맨 아래는 글자 메뉴. 선과 여백만으로 나눈다. */
:root{
  color-scheme:dark;
  --void:#07090b;          /* 불 꺼진 선실 */
  --hull:#10151a;          /* 벽면 금속 */
  --rule:#27313a;          /* 이음매 */
  --ink:#d3dade;           /* 글자: 찬 쪽으로 기운 흰색 */
  --ink-dim:#8c9aa1;       /* 식은 글자 */
  --lamp:#c8392b;          /* 비상등 */
  --amber:#d59a3a;         /* 동면 장치 표시창, 분기 */
  --term:#7fbf8e;          /* 단말 글자 */
  --f-story:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --glow:0;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-story);font-size:15px;line-height:1.6;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(200,57,43,.22),transparent 70%);
  opacity:var(--glow);transition:opacity 1.8s ease}
body.breathing::before{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:calc(var(--glow)*.45)}50%{opacity:var(--glow)}}
@keyframes arrive{from{opacity:0}}
.ship{position:relative;box-sizing:border-box;max-width:1020px;margin:0 auto;padding-inline:20px;padding-block:22px 16px;min-height:100%;
  display:grid;grid-template-columns:210px minmax(0,1fr) 200px;grid-template-rows:1fr auto;
  grid-template-areas:"env main side" "foot foot foot";gap:20px 44px}
h2,h3{font:inherit;margin:0}
/* 왼쪽: 주변 */
.env{grid-area:env;min-width:0;max-height:calc(100vh - 96px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.65}
.env h2{color:var(--ink)}
.env-lines{display:flex;flex-direction:column;gap:.75em;color:var(--ink-dim)}
.env-lines p{margin:0;animation:arrive .9s ease both}
.look{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--ink-dim);margin-top:6px}
/* 가운데: 장소, 나레이션, 선택 */
.main{grid-area:main;min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}
.where{display:flex;align-items:baseline;gap:14px}
.where{flex-wrap:wrap;gap:4px 14px}
.where .day{white-space:nowrap}
.locs{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 0;font-size:15.5px}
.locs>*{padding:0 12px;border-left:1px solid var(--ink-dim)}
.locs>*:first-child{padding-left:0;border-left:0}
.locs button{width:auto;border-top:0;border-right:0;border-bottom:0;font-size:inherit;color:var(--ink-dim);overflow:visible}
.locs button:hover:not(:disabled){background:transparent;color:var(--ink)}
.locs button:disabled{color:#56636a;border-color:var(--ink-dim)}
.locs .on,.locs button.on:disabled{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.story{font-size:15.5px;line-height:1.95}
.up{color:var(--term)}
.q{color:#d9cfb8}
.q1{color:#e9c98f!important}
.q2{color:#9ec9ea!important}
.gauges .hbox{grid-column:1/-1;flex-basis:100%;display:grid;grid-template-columns:1fr auto;gap:1px 12px;border:1px solid var(--rule);padding:6px 9px;margin:.45em 0}
.gauges .hbox{cursor:pointer;user-select:none}
.gauges .hbox dt,.gauges .hbox dd{white-space:nowrap}
.gauges .hbox .bar{width:50px}
.gauges .hloc{color:var(--ink-dim)}
.gauges .hbox dt:first-child{grid-column:1/-1}
.gauges .hbox dt:first-child+dd{grid-column:1/-1;text-align:left;padding-left:1.15em;margin-right:0}
.gauges .hb1{border-color:#e9c98f}
.gauges .hb2{border-color:#9ec9ea}
.savebox{margin-top:2.4em;padding-top:1.4em;border-top:1px solid var(--rule)}
.savebox p{margin:.3em 0;color:var(--ink-dim)}
#night .savebox{border-top:0;margin-top:1.2em;padding-top:0}
.story h3{font-family:var(--f-data);font-size:13px;letter-spacing:.2em;color:var(--amber);margin:2.2em 0 1em}
.story h3:first-of-type{margin-top:.4em}
.story p{margin:0 0 .85em;text-indent:1em}
.story p.bg{color:var(--ink-dim)}
.story p.aside{color:var(--ink-dim)}
.story p.term{font-family:var(--f-data);font-size:13.5px;color:var(--term);text-indent:0;padding-left:1em;line-height:1.7}
.story .journal{margin:1.4em 0 .4em}
.story .journal p,.story p.empty{text-indent:0}
.prologue{max-width:34em}
.prologue p{animation:arrive 1.4s ease both}
.prologue .protitle{font-family:var(--f-data);font-size:22px;letter-spacing:.3em;color:var(--ink);margin:0 0 1.4em;font-weight:500}
button.cur:disabled{color:var(--ink);border-color:var(--ink-dim);border-style:dashed}
.warn{color:var(--lamp);font-weight:500}
.plates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
button.plate{width:100%;text-align:left;padding:5px 10px;display:flex;flex-direction:column;gap:1px;border-color:var(--ink-dim)}
button.plate strong{font-weight:500;font-size:14px}
button.plate small{font-size:12.5px;color:var(--ink-dim);line-height:1.45}
button.plate small.rel{color:var(--ink)}
button.plate small.mark{color:var(--amber)}
button.plate.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.where .day{color:var(--ink-dim);font-size:13px;border-left:1px solid var(--ink-dim);padding-left:14px}
.where .day:empty{display:none}
.log{display:flex;flex-direction:column-reverse;flex:1 1 0;min-height:76px;max-height:340px;overflow:hidden;cursor:default;line-height:1.7;
  -webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%)}
.log p{margin:0;animation:arrive .9s ease both}
.log p.gap{margin-top:.7em}
.log p.aside{color:var(--ink-dim)}
.log p.term{font-family:var(--f-data);font-size:13.5px;color:var(--term)}
.acts{display:flex;flex-direction:column;gap:12px}
.cols{display:flex;flex-direction:column;gap:10px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
button.busy:disabled{color:var(--ink);border-color:var(--ink)}
.bar{display:inline-block;width:64px;height:8px;border:1px solid var(--ink);vertical-align:middle;position:relative}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar.low{border-color:var(--lamp)}.bar.low b{background:var(--lamp)}
.row{display:flex;flex-wrap:wrap;gap:6px}
button.mini{width:auto;min-width:58px;padding:5px 10px}
.grp h3{font-size:13.5px;color:var(--ink-dim);flex:0 0 100%;margin-bottom:-2px}
.grp .hint{margin-left:6px}
button{font:inherit;font-size:14.5px;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:0;
  width:154px;max-width:100%;padding:5px 6px;text-align:center;cursor:pointer;position:relative;overflow:hidden;transition:background .2s,color .2s,border-color .2s}
button:hover:not(:disabled){background:var(--hull)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{color:#56636a;border-color:var(--rule);cursor:default}
button .cool{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(211,218,222,.14);pointer-events:none}
button.fork{border-color:var(--amber);color:var(--amber);box-shadow:inset 0 0 0 2px var(--void),inset 0 0 0 3px var(--amber)}
button.fork:disabled{border-color:var(--rule);color:#56636a;box-shadow:none}
button.wide{width:230px}
.hint{font-size:13px;color:var(--ink-dim);margin:0}
/* 오른쪽: 상태 상자 */
.side{grid-area:side;min-width:0;align-self:start;display:flex;flex-direction:column;gap:10px}
fieldset{border:1px solid var(--ink);margin:0;padding:2px 12px 8px;min-width:0}
legend{padding:0 4px;margin-left:-4px;font-size:14.5px}
.gauges{display:grid;grid-template-columns:1fr auto;gap:1px 12px;margin:0;font-variant-numeric:tabular-nums}
.gauges dd{margin:0;text-align:right}
.gauges .none{grid-column:1/-1;color:var(--ink-dim)}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:8px;height:8px;border:1px solid var(--ink);display:block}
.pips i.spent{background:var(--ink)}
.goal{font-size:13px;color:var(--ink-dim);margin:0}
/* 아래: 글자 메뉴 */
.foot{grid-area:foot;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:4px 22px;font-size:13.5px;color:var(--ink-dim);padding-top:8px}
.foot .name{letter-spacing:.18em;font-family:var(--f-data);color:var(--ink);font-weight:500}
.foot button,.look button{width:auto;border:0;padding:0;font-size:inherit;color:var(--ink-dim);text-align:left}
.foot button:hover:not(:disabled),.look button:hover:not(:disabled){background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.foot button[aria-selected="true"],.look button.on{color:var(--ink)}
.foot button.danger{color:var(--lamp)}
.foot #restartBox{display:inline-flex;gap:12px;align-items:baseline}
/* 일지와 기록 */
.journal{border:1px solid var(--rule);background:var(--hull);padding:14px 16px 16px;line-height:1.8}
.journal h2{font-family:var(--f-data);font-size:12.5px;letter-spacing:.12em;color:var(--amber);margin-bottom:10px}
.journal p{margin:0 0 .8em}
.journal p:last-child{margin-bottom:0}
.debug{font-family:var(--f-data);font-size:12px;color:var(--ink-dim);margin:10px 0 0}
#night{display:flex;flex-direction:column;gap:12px}
.record{grid-column:1/-1;min-width:0;max-width:640px;display:flex;flex-direction:column;gap:26px}
.record>div>h2{color:var(--ink-dim);font-size:13.5px;margin-bottom:8px;text-decoration:underline;text-underline-offset:5px}
.record .hist{display:flex;flex-direction:column;line-height:1.7}
.record .hist p{margin:0}
.record .hist p.act{font-size:13px;color:var(--amber);margin-top:.9em}
.record .hist p.act:first-child{margin-top:0}
.record .hist p.bg,.record .hist p.aside{color:var(--ink-dim)}
.record .hist p.bg{padding-left:12px;border-left:1px solid var(--rule)}
.record .hist p.term{font-family:var(--f-data);font-size:13.5px;color:var(--term)}
.record .runs{display:flex;flex-direction:column;gap:12px}
.record .empty{color:var(--ink-dim);margin:0}
@media (max-width:760px){
  .ship{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"side" "main" "env" "foot";gap:16px;align-content:start;padding-block:16px 16px}
  .log{flex:none;height:180px}
  .env{max-height:none;overflow:visible}
  .grp button{width:calc(50% - 3px)}
  .plates{grid-template-columns:minmax(0,1fr)}
  .row>button:first-child{width:100%}
  button.wide{width:100%}
  .gauges{display:flex;flex-wrap:wrap;gap:0 6px}
  .gauges dd{margin-right:12px}
  .record{grid-row:1}
}
@media (max-height:720px) and (min-width:761px){
  body{font-size:14px}
  .ship{padding-block:12px 8px;gap:10px 44px}
  .main{gap:9px}.acts{gap:8px}.cols{gap:7px}.grp{gap:5px}
  button{padding:3px 6px;font-size:13.5px}
  button.plate{padding:3px 10px}button.plate small{font-size:12px;line-height:1.35}
  .log{line-height:1.6}
  .foot{padding-top:2px}
}
@media (prefers-reduced-motion:reduce){.log p,.env-lines p{animation:none}body.breathing::before{animation:none}body::before{transition:none}}
</style>

</head>
<body>
<div class="ship">
  <section class="record" id="record" hidden></section>
  <aside class="env" id="envCol">
    <h2 id="envName">어둠</h2>
    <div class="env-lines" id="env"><p>보이지 않는다.</p></div>
    <div class="look" id="look" hidden></div>
  </aside>
  <section class="main" id="mainCol">
    <div class="where"><div class="locs" id="place"></div><span class="day" id="day"></span></div>
    <div class="log" id="log" aria-live="polite" title="누르면 글이 바로 나옵니다"></div>
    <div class="acts" id="acts"></div>
    <p class="hint" id="hint" hidden></p>
    <div id="night" hidden></div>
  </section>
  <aside class="side" id="sideCol">
    <fieldset><legend>상태</legend><dl class="gauges" id="gauges"></dl></fieldset>
    <p class="goal" id="goal" hidden></p>
  </aside>
  <footer class="foot" id="tabs">
    <span class="name">SOL. 30</span>
    <button type="button" id="tabPlay" role="tab" aria-selected="true">플레이.</button>
    <button type="button" id="tabRec" role="tab" aria-selected="false">기록.</button>
    <span id="restartBox"><button type="button" id="restart">재시작.</button></span>
  </footer>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const OXMAX=12,DAY=240,HOUR=15,SAVE="sol30-save",RUNS="sol30-runs";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function fresh(){
  const pods=[];for(let i=0;i<8;i++)pods.push(Math.random()<.35);
  return{v:2,day:1,phase:"intro",loc:"cabin",locs:["cabin"],light:false,
    power:0,clock:0,aP:0,aO:0,warm:6,hunger:6,food:0,oxy:8,filters:0,usedF:0,samples:0,analyzed:0,data:0,
    approach:0,contam:0,mood:{calm:0,cur:0,anx:0,obs:0},last:"calm",
    done:{},daily:{},seen:{},told:{},rec:{},choice:{},fork:null,pickSel:null,
    job:null,mach:null,spin:null,pick:false,dim:false,streak:0,lastCrank:0,turns:0,idle:0,quiet:0,chair:0,
    nudgeAt:-99,nudgeI:0,dark0:0,ambI:0,notes:[],journal:[],log:[],hist:[],env:{name:"어둠",lines:["보이지 않는다."]},
    pods:pods,marks:[],helper:null,helper2:null,h:null,fix:0,suitOn:false,suit:0,hT:0,dz:{},dzs:{},cause:null};
}
let s=fresh(),queue=[],timer=null,cooling=false,view="play",runs=[],lastT=Date.now();
try{runs=JSON.parse(localStorage.getItem(RUNS)||"[]")||[]}catch(e){runs=[]}

/* ───────── 글: 장소와 사물 ───────── */
const LOC={cabin:{name:"선실",bg:"room"},hall:{name:"통로",bg:"hall"},mess:{name:"식당",bg:"mess"},cargo:{name:"화물칸",bg:"cargo"},
  lab:{name:"실험실",bg:"lab"},port:{name:"관측창",bg:"port"},cryo:{name:"동면실",bg:"cryo"}};
const BG={
 room:{n:"선실",l:["좁은 방이다. 침상 하나, 접이식 책상 하나, 벽에 박힌 동면 장치 하나.","바닥은 문 쪽으로 기울어 있다. 고정되지 않은 것은 전부 그쪽에 모여 있다.","비상등의 붉은빛이 천장에서 떨어진다. 구석까지는 닿지 않는다.","환기구는 조용하다. 공기에서 오래된 금속 냄새가 난다."]},
 roomDim:{n:"선실",l:["비상등이 숨 쉬듯 밝아졌다 어두워진다. 구석의 어둠이 넓어졌다."]},
 gen:{n:"수동 발전기",at:"cabin",l:["벽에서 접어 내리는 손잡이다. 비상용이라 붉게 칠해져 있고, 칠은 한 번도 벗겨진 적이 없다.","손잡이 아래 명판. 분당 60회전 권장. 연속 사용 20분 이내.","축 주위에 윤활유가 굳어 말라붙어 있다. 처음 몇 바퀴는 그것을 깨는 일이다."]},
 genWorn:{n:"수동 발전기",l:["벽에서 접어 내리는 손잡이다. 손 닿는 자리만 붉은 칠이 벗겨져 쇠가 드러났다.","손잡이 아래 명판. 분당 60회전 권장. 연속 사용 20분 이내. 지킨 적이 없다.","축은 이제 매끄럽게 돈다. 굳은 윤활유는 다 깨져 바닥에 떨어져 있다."]},
 term:{n:"단말",at:"cabin",l:["책상에 박힌 화면이다. 모서리에 금이 가 있지만 켜진다.","글자는 초록색이다. 밝기를 낮출 수 없다.","자판의 몇 글자는 닳아 있다. 가장 많이 닳은 것은 지움 글쇠다."]},
 board:{n:"배전반",at:"cabin",l:["문 옆의 덮개를 열면 나온다.","회로는 스물넷. 표시등이 들어온 것은 셋이다. 나머지의 이름표를 읽어 본다. 기관, 항법, 중력, 조리. 지금은 이름뿐이다."]},
 pod:{n:"내 동면 장치",at:"cabin",l:["벽에 세워진 관 같은 것이다. 그렇게 부르지 말라고 교육받았다.","덮개 안쪽의 완충재에 내 몸 모양이 남아 있다. 천천히 올라오는 중이다.","표시창은 호박색이다. 건드리지 않아도 한 줄이 떠 있다. 개방 횟수 2."]},
 hall:{n:"통로",l:["통로는 배의 등뼈다. 모든 방이 여기로 열린다.","천장이 낮아 고개를 조금 숙여야 한다. 벽에는 손잡이 줄이 길게 이어져 있다. 무중력에서 쓰던 것이다. 지금은 기울기 때문에 쓴다.","다섯 걸음마다 비상등. 그 사이의 어둠에서 물 떨어지는 소리가 난다."]},
 lockers:{n:"비품함",at:"hall",l:["통로 벽에 박힌 비품함 여섯. 문짝이 얇다. 둘은 추락 때 우그러져 열리지 않는다.","안쪽에 점검표가 붙어 있다. 점검자 서명란은 매번 같은 글씨다."]},
 purifier:{n:"산소 정제기",at:"hall",l:["통로 벽감에 들어앉은 회색 상자다. 허리 높이.","앞면에 필터 서랍이 셋. 서랍마다 교체일을 적는 칸이 있다. 마지막 기록은 출발 전이다.","돌 때는 덜컹거린다. 덜컹거림이 멎으면 그때가 문제다."]},
 cockpit:{n:"조종실 앞",at:"hall",l:["통로의 맨 앞이다. 여기서부터 바닥이 구겨져 있다.","문틀이 안쪽으로 접혔다. 틈은 팔 하나가 들어갈 만하다.","틈에서 찬 공기가 나온다. 흙냄새가 섞여 있다."]},
 cryodoor:{n:"동면실 앞",at:"hall",l:["문은 다른 문보다 두껍다. 손을 대면 손바닥이 달라붙을 만큼 차다.","눈높이에 손바닥만 한 창이 있다. 안쪽에 성에가 끼어 있다.","문 옆 패널에 숫자가 떠 있다. 필요 전력 40."]},

function markPods(){
  const p=s.done.y_temp?.8:.7,m=[];
  s.pods.forEach((bad,i)=>{if(bad&&Math.random()<p)m.push(i)});
  const clean=s.pods.map((b,i)=>i).filter(i=>!m.includes(i)).sort(()=>Math.random()-.5);
  while(m.length<3&&clean.length){const i=clean.shift();if(!s.pods[i]||m.length<3)m.push(i)}
  s.marks=m.sort(()=>Math.random()-.5).slice(0,3);
}

function gaugeOf(k){return k==="suit"?s.suit:k==="oxy"?s.oxy:k==="warm"?s.warm:s.hunger}
function danger(dt){
  /* 0인 수치마다 시계가 돈다. 둘 이상이 0이면 1.5배로 빨리 돈다. 1 이상으로 올리면 시계가 되돌아간다. */
  const keys=["warm","hunger"].concat(s.day>=2&&!outside()?["oxy"]:[]).concat(s.suitOn&&outside()?["suit"]:[]);
  const zeros=keys.filter(k=>gaugeOf(k)<=0).length;
  for(const k of keys){
    const v=gaugeOf(k);
    if(v<=0){
      s.dz[k]=(s.dz[k]||0)+dt*(zeros>1?1.5:1);const st=s.dz[k]/LIMIT[k];
      [0,.45,.8].forEach((th,i)=>{if(st>=th&&!s.dzs[k+i]){s.dzs[k+i]=true;say([DZ[k][i]])}});
      if(s.dz[k]>=LIMIT[k]){die(k);return true}
    }else if(v>=1&&s.dz[k]){s.dz[k]=0;[0,1,2].forEach(i=>{delete s.dzs[k+i]})}
  }
  return false;
}
function left(k){return s.dz[k]>0&&gaugeOf(k)<1?Math.max(0,Math.ceil(LIMIT[k]-s.dz[k])):0}

    runs.unshift({helper:"생존 실패 · "+s.day+"일차 · "+d.name,choice:Object.assign({},s.choice),journal:s.journal.slice(),approach:s.approach});

 pick2:"\"손이 하나 더 생기는 거네.\" 생체모방공학자가 사람보다 덮개의 경첩을 먼저 본다.",
 small:["\"도마뱀붙이 발바닥 알지. 접착제가 없어. 털이 많을 뿐이야. 나 그걸로 학위 받았어. 털 세는 걸로.\"",
  "생체모방공학자가 식량을 반으로 꺾어 단면을 본다. \"기포가 없네. 구조재로는 합격이야. 음식으로는 불합격이고.\"",
  "\"사람이 만든 건 다 직각이야. 살아 있는 건 직각을 안 써. 직각은 금이 가거든. 이 배가 어디서 찢어졌는지 봐. 전부 모서리야.\"",
  "\"너 걱정할 때 어깨가 올라가. 거기에 하중이 걸려. 그러다 부러져. 내려.\"",
  "생체모방공학자는 보고서를 쓰지 않는다. 대신 고친 자리에 날짜를 긁어 새긴다. 인사 기록의 '제출 지연 상습'이 무엇인지 알겠다.",
  "\"거미줄은 같은 굵기 강철보다 질겨. 그런데 거미는 그걸 먹고 다시 뽑아. 우리는 고철을 못 먹잖아. 그게 차이야.\"",
  "\"훈련소 때 네가 내 도시락 먹은 거 기억나? 난 기억나. 그건 허용 오차 밖이야.\"",
  "\"수석 된 거 축하한다는 말을 삼 년째 못 했네. 축하해. 이 꼴이 났지만.\""],
 work:{gen:["생체모방공학자가 손잡이를 돌리다 멈추고 축에 귀를 댄다. \"안쪽이 한쪽만 닳았어. 네가 오른손으로만 돌려서 그래. 번갈아 돌려.\"","\"사람 팔은 이걸 돌리라고 만든 게 아니야. 던지라고 만든 거야. 그래서 금방 지쳐. 설계 목적이 달라.\""],
  air:["\"필터 주름을 봐. 폐랑 똑같이 접었어. 누가 베낀 거야. 잘 베꼈어.\"","생체모방공학자가 헌 필터를 빛에 비춰 본다. \"얼룩이 주름을 따라 자랐어. 길을 아는 것처럼. 이건 닦지 말고 봐 둬.\""],
  fix:["\"문틀이 휜 방향을 보면 힘이 어디서 왔는지 알아. 앞이 아니야. 아래에서 왔어. 떨어진 게 아니라 내려앉은 거야.\"","생체모방공학자가 지렛대를 걸며 말한다. \"뼈는 부러지면 더 굵게 붙어. 금속은 안 그래. 그래서 내가 있는 거지.\""],
  rest:["생체모방공학자가 식탁에 엎드려 있다가 고개만 든다. \"쉬는 중이야. 근육은 쉴 때 붙어. 일할 때가 아니라.\"","\"가만히 있으니까 이 배 소리가 들려. 삐걱거리는 데가 세 군데야. 두 군데는 내가 알아. 하나는 몰라.\""]}},
/* 02 화학생태학 · 브라질 · 해요체 */
{wake:["눈을 뜨기 전에 코가 먼저 움직인다. 숨을 깊이 들이쉬고, 얼굴을 찡그리고, 한 번 더 들이쉰다.","눈을 뜬다. 나를 보고 웃는다.","말을 못 하는 한 시간이 이 사람에게는 삼 년보다 길 것이다."],
 food:"\"와, 이건 냄새가 없어요. 아무 냄새도요. 그게 더 무서워요.\"",
 all:"화학생태학자는 듣는 내내 코로 숨을 쉰다. 내 말이 맞는지 공기에 묻는 것처럼.",
 first:["화학생태학자가 처음으로 말을 한다.","\"박사님, 이 배에서 흙냄새가 나요.\"","\"그런데 흙이 아니에요. 같은 것이 계속 나요. 일정하게요. 냄새가 박자를 가졌어요.\"","추락했다는 말에는 \"아, 그래서요\"라고만 한다."],
 s1:["화학생태학자가 통로를 끝에서 끝까지 걷는다. 눈을 감고 걷는다.","\"화물칸 쪽이 제일 진해요. 선실은 옅고요.\"","\"박사님한테서도 나요. 조금요. 아, 이제 저한테서도 나겠네요.\"","웃으면서 말한다."],
 s1fx:st1("scent","화학생태학자의 소견: 선내에 일정한 주기로 퍼지는 휘발 성분이 있다. 화물칸에서 가장 짙다. 사람의 몸에도 밴다."),
 kc:()=>s.done.k_seat,
 kpit:["\"여기 분한테서는 안 나요. 그 냄새가요.\" 화학생태학자가 왼쪽 좌석을 지나친다.","오른쪽 좌석 앞에서 오래 서 있다.","\"여기는 많이 나요. 그리고 땀 냄새가 없어요. 무서워서 나간 사람은 땀 냄새를 남겨요.\""],
 seal:["화학생태학자가 가져온 막 조각의 용기를 열고 맡는다.","\"메운 자리에서는 다른 냄새가 나요. 달아요.\"","\"상처가 아물 때 나는 냄새랑 비슷해요. 사람 거요.\""],
 pos:["\"아.\" 잠깐 생각한다.","\"그럼 이제 저한테서 나는 냄새가 제 냄새가 아니네요.\"","\"맡아 볼 수가 없네요. 자기 냄새는 못 맡으니까.\""],
 hide:"\"알고 계셨네요.\"",neg:"\"믿으세요?\"",ask:"\"네, 하세요.\" 소매를 걷는다. \"피 냄새는 저도 싫어하지만요.\"",d11:"\"박사님, 부탁이 하나 있어요.\"",
 task:{rest:"\"쉬면서 말해도 돼요? 말 안 하면 못 쉬어요.\"",gen:"\"돌리면 윤활유 냄새가 올라와요. 삼 년 묵은 냄새예요. 나쁘지 않아요.\"",air:"\"필터는 냄새로 알아요. 갈 때가 되면 시큼해져요.\"",fix:"\"힘쓰는 건 자신 없는데, 해 볼게요.\""},
 out:{seal:"헬멧 안에서 코를 킁킁거리는 소리가 무전으로 들린다. \"아무 냄새도 안 나요. 이게 제일 답답해요.\"",boots:"\"벗어 놓은 신발은 주인 냄새가 제일 오래 남는 물건인데요. 헬멧만 열 수 있으면.\" 화학생태학자가 말한다.",dig:"\"녹이 안 슬었어요. 여기 공기에 산소가 이만큼 있는데요. 뭔가가 덮고 있었던 거예요.\" 화학생태학자가 말한다."},
 eIntro:"\"저도 나가면 안 돼요? 헬멧 쓰면 아무것도 못 맡긴 하지만요.\"",eAlone:"\"표본 용기는 꼭 닫아서 가져오세요. 안에서 제가 열게요.\"",eBoth:"화학생태학자가 표본 용기를 주머니마다 넣는다. 주머니가 모자란다.",eSend:"\"밖은 아무 냄새도 안 나요. 헬멧 때문에요. 그런데 외판이요, 붙고 있어요. 보셔야 해요.\"",
 req:{intro:["화학생태학자가 선외복 헬멧을 안고 서 있다.","\"헬멧을 열게 해 주세요. 밖에서요. 십 초만요.\"","\"선외복 필터를 거치면 절반이 걸러져요. 직접 맡아야 알아요.\""],
  side:["둘이 선체 바깥에 선다. 잠금을 푼다. 십 초를 센다.","화학생태학자는 눈을 감고 있다. 여섯에서 눈물이 흐른다. 열에서 닫는다.","\"이름을 불러요. 누구 이름인지는 모르겠어요. 그런데 부르는 거예요, 분명히.\""],
  fx(){s.approach+=1;s.contam+=1;rec("naming");note("선외에서 헬멧을 십 초간 개방. 화학생태학자의 보고: 신호는 특정한 대상을 부르는 성격이다.")},
  log:"화학생태학자의 요청대로 선외에서 헬멧을 십 초간 열게 했다. 절차 위반이다. 내가 허락했다.",
  refuse:["안 된다고 한다. 밖의 공기를 사람 몸에 들일 수는 없다.","\"네. 박사님 말씀이 맞아요.\"","처음으로 웃지 않고 말한다."],
  later:["내일 다시 이야기하자고 한다.","\"내일이요. 네.\" 헬멧을 무릎에 올려놓고 앉아 있다."]},
 solo(){s.contam+=1;return "화물칸 격벽 앞에 화학생태학자가 앉아 있다. 격벽은 닫혀 있다. 틈에 코를 대고 있었다고 한다."},
 pick2:"\"이분 냄새 알아요. 좋은 분이에요.\" 화학생태학자가 말한다. 근거는 그것뿐이다.",
 small:["\"개미는 죽으면 냄새가 나요. 그럼 동료들이 내다 버려요. 살아 있는 개미한테 그 냄새를 묻히면요, 살아서 발버둥 치는데도 내다 버려요. 냄새가 사실보다 세요.\"",
  "화학생태학자가 식량 포장을 뜯자마자 말한다. \"닭고기 맛이라는데, 근처에 닭이 지나간 적도 없어요. 향료 두 가지로 닭을 흉내 낸 거예요. 저한테는 안 통해요.\"",
  "\"박사님 논문 3장 각주 14번이요, 그거 제가 학부 때 틀렸다고 메일 보냈었는데 답장 안 주셨어요.\" 답장을 안 준 기억이 난다.",
  "\"풀은 벌레한테 먹히면 비명을 질러요. 냄새로요. 그럼 그 벌레를 잡아먹는 벌이 와요. 풀 깎은 냄새가 그거예요. 우리는 그걸 상쾌하다고 하고요.\"",
  "화학생태학자는 내가 불안할 때를 맞힌다. \"지금요. 지금 그래요. 땀이 달라져요.\" 맞다. 맞아서 싫다.",
  "\"향료 반입 금지는 제가 요청한 거예요. 삼 년 동안 남의 샴푸 냄새를 맡는 게 싫어서요. 대신 여덟 명 체취는 다 외웠어요. 눈 감고도 누군지 알아요.\"",
  "\"동면에서 깨면 냄새가 제일 먼저 돌아와요. 그다음이 소리고요. 기억은 맨 나중이에요. 그래서 깨자마자 한 일이 박사님 냄새 맡은 거예요. 죄송해요.\"",
  "\"브라질에서는 비 오기 전 냄새에 이름이 있어요. 여기 냄새에도 이름을 붙여야 하는데, 붙이면 정들까 봐요.\""],
 work:{gen:["\"돌릴 때마다 윤활유 냄새가 올라와요. 삼 년 묵었어요. 그 밑에 다른 사람 손 냄새가 있어요. 박사님 거 말고요. 오래된 거요.\"","화학생태학자가 숨이 차서 말을 못 하는 것을 처음 본다. 열 바퀴쯤 뒤에 겨우 말한다. \"말하면서, 돌리면, 안 되네요. 둘 중, 하나만.\" 말을 고른다."],
  air:["\"필터는 냄새로 알아요. 갈 때가 되면 시큼해져요. 그런데 지금 이건 시큼하지 않고 달아요. 단 건 처음이에요.\"","\"정제기는 숨만 걸러요. 냄새는 그대로 지나가요. 그러니까 우리는 깨끗한 공기에 섞인 그 신호를 계속 마시는 거예요. 재밌죠.\""],
  fix:["화학생태학자가 지렛대에 온몸으로 매달려 있다. \"힘쓰는 건, 제 전공이, 아닌데요.\" 문틀은 움직이지 않는다.","\"틈에서 나오는 냄새가 두 겹이에요. 하나는 움직이지 않는 냄새고요. 하나는 지나간 냄새예요.\""],
  rest:["\"쉬면서 말해도 돼요? 말 안 하면 못 쉬어요.\" 그리고 이십 분을 말한다. 무슨 말이었는지는 기억나지 않는다. 덜 외로웠다는 것만 기억난다.","화학생태학자가 눈을 감고 있다. 자는 줄 알았다. \"박사님 지금 걱정하시죠. 여기까지 와요.\""]}},

{wake:["눈을 뜬다. 천장을 보지 않고 자기 손목을 본다. 시계가 없는 손목이다.","손가락으로 맥을 짚는다. 입술이 숫자를 센다.","다 세고 나서야 나를 본다."],
 food:"\"삼 년 만의 식사는 소량부터입니다. 그 절차서는 제가 썼습니다.\"",
 all:"시간생물학자는 사건마다 언제였는지를 되묻는다. 절반은 답하지 못한다.",

 s1:["시간생물학자가 내 일지의 작성 시각을 표로 옮겨 적는다.","\"매일 사십 분씩 늦어지고 있습니다. 주무시는 시각이요. 엿새에 네 시간.\"","\"사람은 해가 없으면 하루가 조금 길어집니다. 그런데 이건 그 폭이 아닙니다.\"","\"다른 시계에 맞춰지고 있는 겁니다. 이 행성의 것에.\""],

 kpit:["시간생물학자는 조종사의 손목시계를 본다. 유리가 깨져 있다.","\"멈춘 시각이 추락 시각일 겁니다. 사람들은 멈춘 시계를 보면 그 시각에 무슨 일이 있었는지를 묻습니다.\"","\"저는 그 전날 이분이 몇 시에 잤는지가 궁금합니다. 잠을 못 잔 사람은 판단이 흐려집니다. 잠을 너무 잘 잔 사람도요.\"","빈 좌석 쪽을 본다."],
 seal:["시간생물학자가 외판 사진을 확대해 본다.","\"가장자리에 줄이 있습니다. 나이테처럼요. 낮에만 자라고 밤에는 멈추는 겁니다.\"","\"풀도 나무도 아닌데 해를 따릅니다. 해가 보이지도 않는데요. 이 행성에서는 모든 것이 같은 시계를 봅니다.\""],

 hide:"\"알고 계셨습니까. 언제부터요.\"",neg:"\"믿으십니까.\"",ask:"\"해야 할 일입니다.\" 소매를 걷는다. \"채혈 시각을 적어 주십시오.\"",d11:"\"드릴 말씀이 있습니다.\"",
 task:{rest:"\"쉬는 시각을 정해 주시면 그때 쉬겠습니다.\"",gen:"\"한 시간에 십 분씩 돌리겠습니다. 리듬이 있어야 오래 합니다.\"",air:"\"교체 시각을 적어 두겠습니다. 숨도 주기입니다.\"",fix:"\"해 보겠습니다. 월동 기지에서는 문이 얼어서 매일 했습니다.\""},
 out:{seal:"\"그림자가 없군요.\" 시간생물학자가 하늘을 본다. \"해가 어디 있는지 모르면 몸은 시간을 잃습니다.\"",boots:"\"신발을 벗는 것은 잠자리에 드는 사람의 동작입니다.\" 시간생물학자가 말한다.",dig:"\"얼마나 묻혀 있었는지는 군락의 겹으로 알 수 있을 겁니다. 한 겹이 서른 날이라면요.\" 시간생물학자가 겹을 센다. 세다가 그만둔다."},
 eIntro:"\"나가신다면 사십 분을 넘기지 마십시오. 제가 시간을 재겠습니다.\"",eAlone:"\"십 분마다 무전을 주십시오. 간격이 벌어지면 제가 부르겠습니다.\"",eBoth:"시간생물학자가 선외복 소매에 시각을 적는다. 나간 시각이다.",eSend:"\"예정보다 십이 분 늦었습니다. 이유는 모르겠습니다. 외판이 메워지고 있습니다. 그것은 확실합니다.\"",
 req:{intro:["시간생물학자가 표 한 장을 내민다. 내 수면 시각이 사선으로 내려가 있다.","\"선내 조명을 지구 시간으로 돌리겠습니다. 스물네 시간 주기로 켜고 끕니다.\"","\"우리 몸을 저쪽 시계에서 떼어 내야 합니다. 밤에도 불을 켜는 시간이 생깁니다.\""],
  side:["배전반의 시간 설정을 지구 시각으로 돌린다.","첫날 밤, 정해진 시각에 선내등이 전부 켜진다. 창밖의 형체들이 한 걸음 다가선다.","\"견디셔야 합니다. 사흘이면 몸이 돌아옵니다.\""],
  fx(){s.power=Math.max(0,s.power-8);s.approach+=2;rec("earth");note("선내 조명을 지구 시간 24시간 주기로 전환. 야간 점등 시 외부 개체들의 접근 확인.")},
  log:"시간생물학자의 요청대로 선내 조명을 지구 시간 주기로 바꿨다. 밤에 불이 켜진다.",
  refuse:["안 된다고 한다. 밤에 불을 켜면 저들이 온다.","\"알겠습니다. 기록은 계속하겠습니다. 박사님 것도요.\""],
  later:["내일 다시 이야기하자고 한다.","\"내일이면 사십 분이 더 밀립니다.\" 그 말만 한다."]},
 solo(){s.power=Math.max(0,s.power-8);s.approach+=2;return "선내등이 전부 켜져 있다. 시간생물학자가 배전반 앞에 서 있다. \"지구는 지금 아침입니다.\""},
 pick2:"시간생물학자가 장치의 기록을 읽는다. \"수면 곡선이 깨끗합니다. 이 사람이면 됩니다.\"",
 small:["\"극야 기지에서는 석 달 동안 해가 안 뜹니다. 사람들은 석 달째에 싸웁니다. 꼭 석 달째에요. 이유는 매번 다릅니다. 시기만 같습니다.\"",
  "시간생물학자는 식량을 먹는 데 정확히 사 분을 쓴다. 맛에 대해서는 말하지 않는다. \"몸은 지금이 저녁이라고 생각합니다. 무엇이든 넣어 줘야 시계가 안 틀어집니다.\"",
  "\"박사님은 걱정이 있을 때 왼쪽으로 누워 주무십니다.\" 어떻게 아느냐고는 묻지 않는다.",
  "\"사람 몸에는 시계가 하나가 아닙니다. 간에 하나, 폐에 하나, 피부에 하나. 전부 조금씩 다르게 갑니다. 맞춰 주는 것은 빛입니다. 여기에는 그 빛이 없습니다.\"",
  "\"동면을 설계할 때 꿈을 꾸게 할지 말지로 일 년을 싸웠습니다. 제가 졌습니다. 꾸게 됐죠. 삼 년 치 꿈을 기억하십니까.\" 기억나지 않는다. \"다행입니다.\"",
  "\"매미 중에는 십칠 년에 한 번 나오는 것이 있습니다. 땅속에서 햇수를 셉니다. 어떻게 세는지는 아직 모릅니다. 저는 그게 부럽습니다.\"",
  "\"저는 사람을 이름보다 수면 곡선으로 기억합니다. 박사님 것은 톱니 모양입니다.\"",
  "\"노르웨이 말에는 해가 다시 뜨는 날을 가리키는 말이 따로 있습니다. 여기서는 쓸 일이 없겠네요.\""],
 work:{gen:["\"십 분 돌리고 오십 분 쉽니다. 그 간격이면 열흘을 합니다. 박사님처럼 한 번에 몰아서 돌리면 엿새째에 어깨가 나갑니다. 엿새째는 이미 지나셨죠.\"","시간생물학자는 돌리면서 숫자를 세지 않는다. 대신 숨을 센다. \"들숨 넷에 한 바퀴입니다. 몸이 박자를 만들면 머리가 쉽니다.\""],
  air:["\"산소가 가장 얇은 시각은 새벽입니다. 우리가 가장 깊이 자는 때입니다. 그 직전에 돌리는 것이 맞습니다. 자기 전이 아니라요.\"","\"필터 교체 시각을 적고 있습니다. 간격이 줄고 있습니다. 필터가 나빠진 것이 아닙니다. 우리가 더 자주 숨을 쉬는 겁니다.\""],
  fix:["\"월동 기지에서는 문이 얼어서 매일 아침 이렇게 했습니다. 요령은 힘이 아닙니다. 금속이 가장 차가운 시각에 하면 됩니다. 지금입니다.\"","시간생물학자가 지렛대를 걸고 기다린다. 한참 기다린다. \"서두르면 부러집니다. 금속도 지칩니다.\""],
  rest:["시간생물학자는 눕지 않고 벽에 기대앉아 있다. \"낮잠은 이십 분을 넘기면 안 됩니다. 십칠 분 남았습니다.\"","\"쉬는 것은 아무것도 안 하는 것이 아닙니다. 몸이 밀린 일을 하는 겁니다. 박사님 몸은 밀린 일이 많습니다.\""]}},
/* 04 우주고고학 · 튀르키예 */
{wake:["눈을 뜬다. 초점이 맞는 데 한참 걸린다.","입술이 움직인다. 소리는 나오지 않는다. 절차서대로다. 한 시간은 말을 하지 못한다.","손이 내 소매를 잡는다. 힘이 없다. 놓지는 않는다."],
 food:"\"이게 삼 년 만의 첫 끼라니.\"",all:"고고학자는 끝까지 듣는다. 눈을 감지 않는다.",
 first:["고고학자가 처음으로 말을 한다. 목이 갈라져 있다.","\"유적은요.\"","추락보다, 조종사보다 먼저 그것을 묻는다.","없다고 답한다. 아직은 없다고 고쳐 말한다."],
 s1:()=>s.rec.ridge?["고고학자가 내 지형 스케치를 오래 본다.","\"이 선은 누가 그었습니까.\"","내가 그렸다고 하자 고개를 젓는다. \"종이 말고요. 저 능선요.\"","\"자연은 직선을 긋지 않습니다. 긋는 것은 무언가를 옮기는 쪽입니다.\""]
              :["고고학자가 관측창 앞에 서 있다. 한참 말이 없다.","\"북동쪽 능선이 이상합니다. 선이 곧아요.\"","나는 나흘 동안 보지 못한 것이다.","\"자연은 직선을 긋지 않습니다. 긋는 것은 무언가를 옮기는 쪽입니다.\""],
 s1fx:st1("ridge","고고학자의 소견: 북동쪽 능선의 직선은 자연 지형이 아니다."),
 kc:()=>s.done.k_seat,
 kpit:["고고학자가 오른쪽 좌석 밑의 책자를 집어 든다. 수동 발전기 설명서다.","\"나가기 전에 이것을 읽었습니다. 급하게 나간 사람은 설명서를 읽지 않아요.\"","\"이 사람은 달아난 것이 아닙니다. 어디로 갈지 알고 나갔어요.\""],
 kfx(){rec("manual_b")},
 seal:["고고학자에게 메워진 균열을 이야기한다.","\"메운 것이군요. 닫은 겁니다, 상처를요.\"","\"복원은 우리가 유물에 하는 일입니다. 다시 쓰려는 것에만 합니다.\""],
 s2c:()=>s.rec.metal,
 s2:["고고학자가 군락 아래에서 나온 금속 조각을 손전등에 비춘다.","\"외판입니다. 우리 배 것이 아니에요. 합금이 다릅니다. 이음 간격도요.\"","\"유적은 건물이 아니었습니다. 배입니다. 우리가 처음이 아니에요.\"","그 말을 하는 얼굴이 밝다. 평생 찾던 것을 찾은 사람의 얼굴이다."],
 s2fx(){rec("ships");note("군락 아래에서 다른 선체의 외판 발견. 우리보다 먼저 온 배가 최소 한 척 있다.")},
 pos:["\"양성이군요.\" 고고학자가 먼저 말한다. \"얼굴에 써 있습니다.\"","\"저는 멀쩡합니다. 그게 증상이라고 하시겠죠.\"","웃는다. 웃음이 평소와 같다. 같아서 더 모르겠다."],
 hide:"\"알고 계셨군요.\"",neg:"\"믿으십니까.\"",ask:"\"저를 의심하시는군요.\" 소매를 걷는다. \"저라도 그랬을 겁니다. 그래도 기분은 나쁘네요.\"",d11:"\"드릴 말씀이 있습니다.\"",
 task:{rest:"\"쉬는 법은 발굴장에서 배웠습니다. 비 올 때요.\"",gen:"손잡이를 잡는 자세가 삽을 잡는 자세다.",air:"헌 필터를 층층이 쌓아 날짜를 적는다.",fix:"\"문을 여는 건 제 전공입니다. 보통은 천 년쯤 닫혀 있던 것이지만.\""},
 out:{seal:"고고학자는 막을 건드리지 않고 한참 본다. \"복원이군요.\"",boots:"\"신발을 벗는 것은 들어가는 사람이 하는 일입니다.\" 고고학자가 말한다. \"나가는 사람이 아니라.\"",dig:"고고학자가 내 삽을 가져간다. 그리고 손으로 판다. 흙을 터는 손이 떨린다."},
 eIntro:"\"밖에 있는 것은 제 전공입니다.\"",eAlone:"\"가져올 수 있는 것은 전부 가져오세요. 위치는 사진으로요.\"",eBoth:"고고학자가 삽을 챙긴다. 선외복보다 삽을 먼저 챙긴다.",eSend:"\"외판이 메워지고 있습니다. 직접 보셔야 해요.\"",
 req:{intro:["고고학자가 선외복 두 벌을 들고 서 있다.","\"능선 쪽으로 갈 수 있는 데까지 가 봅시다. 오늘요. 산소가 절반 남으면 돌아서겠습니다.\"","\"먼저 온 배가 저기 있어요. 서른 솔이 다 가기 전에 조금이라도 가까이서 봐야 합니다.\""],
  side:["둘이서 군락을 지나 능선 쪽으로 걷는다. 걸음을 센다. 삼백에서 헬멧의 경고등이 켜진다. 능선은 조금도 가까워지지 않았다.","돌아서야 한다. 고고학자는 돌아서는 대신 그 자리에 무릎을 꿇고 재를 걷어 낸다. 주먹으로 땅을 두드린다. 속이 빈 소리가 난다.","\"여기도예요. 능선까지 안 가도 됩니다. 이 아래 전부예요.\"","일어나지 않으려는 것을 끌고 돌아온다. 돌아오는 내내 그는 뒤를 본다. 나는 보지 않는다."],
  fx(){s.approach+=1;rec("ridgefoot");note("능선 쪽으로 가는 길의 절반도 못 가서 산소 때문에 돌아섰다. 돌아선 자리의 지면 아래가 비어 있다. 고고학자는 구조물이 능선에서 여기까지 이어져 있다고 본다.")},
  log:"고고학자의 요청대로 능선 쪽으로 산소가 허락하는 데까지 걸었다. 능선에는 닿지 못했다. 닿을 수 있는 거리가 아니다.",
  refuse:["안 된다고 한다. 산소도 시간도 모자란다.","고고학자는 선외복을 걸이에 도로 건다. 거는 손이 거칠다.","\"박사님은 살아 있는 것만 보시니까요.\""],
  later:["내일 다시 이야기하자고 한다.","고고학자는 대답하지 않는다. 선외복을 든 채로 서 있다."]},
 solo(){s.approach+=2;return "새벽에 기밀실 문이 열렸다 닫히는 소리가 났다. 고고학자의 장화에 새 흙이 묻어 있다. 묻지 않는다. 물으면 답할 것이기 때문이다."},
 pick2:"\"이 사람이면 됩니다.\" 고고학자가 말한다. 근거는 말하지 않는다.",
 small:["\"추천서에 뭐라고 쓰셨습니까.\" 고고학자가 묻는다. 유적이 없는 행성에 고고학자가 필요한 이유를 지어냈다고 답한다. \"지어낸 게 맞았네요.\"",
  "고고학자는 식량 포장지를 버리지 않고 접어 둔다. 천 년 뒤에 누가 발굴할 때 층위를 알 수 있어야 한다고 한다. 농담인지 모르겠다.",
  "\"발굴에서 제일 많이 나오는 게 뭔지 아십니까. 쓰레기입니다. 사람은 쓰레기로 기억됩니다.\"",
  "고고학자가 통로 벽의 긁힌 자국을 손으로 짚는다. 추락 때 생긴 것이라고 하자 실망한 얼굴이 된다.",
  "\"박사님은 살아 있는 것만 보시죠. 저는 죽은 것만 봅니다. 둘이 합치면 한 사람 몫은 되겠네요.\"",
  "고고학자가 식량을 씹다가 멈춘다. \"이건 발굴해도 음식인 줄 모를 겁니다.\" 처음으로 의견이 일치한다.",
  "\"튀르키예에는 만 이천 년 된 돌기둥이 있습니다. 세운 사람들이 일부러 흙으로 덮었어요. 묻어야 남는다는 것을 알았던 겁니다. 이 배도 반은 묻혔네요.\"",
  "\"발굴에서는 가장 나중 것부터 걷어 냅니다. 이 배의 맨 위층은 박사님의 닷새입니다. 포장지 스물몇 장하고 테이프 자국. 깔끔한 층이에요.\""],
 work:{gen:["고고학자는 손잡이를 삽자루처럼 쥐고 돌린다. \"발굴장 양수기가 이랬습니다. 비가 오면 구덩이에 물이 차거든요. 밤새 돌렸어요. 그때 지킨 것은 죽은 사람들이었고요.\"","\"손잡이가 한쪽만 닳았습니다. 박사님 손 자리예요. 닷새 만에 흔적이 생겼어요. 사람은 금방 남깁니다.\""],
  air:["고고학자가 헌 필터를 층층이 쌓아 놓았다. 맨 아래가 가장 오래된 것이다. \"아래로 갈수록 얼룩이 옅습니다. 거꾸로 읽으면 이 배에 그것이 들어온 순서가 나와요.\"","\"숨을 걸러서 다시 쉬는 건 무덤 안에서 하는 일입니다. 농담입니다.\" 웃지 않는다."],
  fix:["\"문을 여는 건 제 전공입니다.\" 고고학자가 틈에 손전등을 먼저 넣는다. \"열기 전에 봅니다. 연 다음에는 다시 못 보는 것이 있어서요.\"","\"닫힌 방은 닫은 사람의 마지막 생각입니다. 이 문은 닫은 게 아니라 닫힌 거네요. 생각이 없습니다. 그건 좀 쉽습니다.\""],
  rest:["고고학자가 식탁에 식량 포장지를 펴 놓고 접힌 자국을 보고 있다. \"박사님은 늘 오른쪽 위부터 뜯습니다. 한 장도 빠짐없이요. 저는 이런 걸 보면 쉬어집니다.\"","\"발굴장에서는 비 오는 날 쉽니다. 여기는 비가 안 오네요. 쉬는 날이 없는 땅입니다.\""]}},
/* 05 생물음향학 · 인도 · 합쇼체, 말수 적음 */
{wake:["눈을 뜨지 않는다. 깨어 있다는 것은 손가락으로 안다. 덮개의 가장자리를 두드리고 있다.","한참 뒤에 눈을 뜬다. 나를 보지 않고 배관 쪽을 본다.","손짓으로 조용히 하라고 한다. 나는 아무 말도 하지 않았다."],

 s1:["생물음향학자가 비품함에서 휴대용 녹음기를 찾아냈다. 지난밤 내내 창가에 두었다고 한다.","\"들어 보십시오.\" 이어폰 한쪽을 건넨다.","바람 소리. 그리고 바람이 아닌 것.","\"간격이 있습니다. 칠 초. 바람은 간격을 지키지 않습니다.\""],

 kc:()=>s.done.k_seat,
 kpit:["생물음향학자가 조종사 앞에서 녹음기를 끈다. 이 사람에게서 처음 보는 예의다.","빈 좌석의 통신기에서 마지막 송신을 꺼내 듣는다. \"숨소리뿐입니다. 삼십 초. 말은 없습니다.\"","\"숨이 고릅니다. 무서운 사람의 숨이 아닙니다. 무언가를 듣고 있는 사람의 숨입니다.\""],

 eIntro:"\"밖의 소리를 선체 없이 듣고 싶습니다.\"",eAlone:"\"무전을 켜 두십시오. 말은 안 하셔도 됩니다. 숨소리면 됩니다.\"",eBoth:"생물음향학자가 녹음기를 선외복 가슴에 테이프로 붙인다.",eSend:"\"외판이 메워지고 있습니다. 두드리면 한 덩어리의 소리가 납니다. 들어 보셔야 합니다.\"",
 req:{intro:["생물음향학자가 녹음기를 두 손으로 들고 서 있다.","\"그 소리를 밖으로 틀어 보고 싶습니다. 외부 스피커로요.\"","\"우리가 들었다는 것을 알리는 겁니다.\""],
  side:["스피커에서 그들의 소리가 나간다. 능선 쪽의 소리가 멎는다.","처음으로, 완전히 조용하다.","그리고 다른 소리가 온다. 더 짧다.","\"대답입니다.\" 생물음향학자가 처음으로 웃는다."],
  fx(){s.power=Math.max(0,s.power-5);s.approach+=3;rec("reply");note("녹음한 외부 소리를 스피커로 송출. 외부 소리가 멎었다가 다른 형태로 돌아왔다. 응답으로 보인다.")},

 solo(){s.approach+=3;return "밤중에 외부 스피커가 한 번 울렸다. 짧게. 생물음향학자는 자고 있었다고 한다. 녹음기의 재생 횟수가 하나 늘어 있다."},
 pick2:"생물음향학자가 덮개에 귀를 댄다. 한참 듣는다. 고개를 끄덕인다.",
 small:["\"개인 장비 승인 서명이 불명확하다는 건 사실입니다. 제가 했습니다. 제 것은 제가 제일 잘 아니까요.\"",
  "생물음향학자는 식량을 씹는 소리를 녹음한다. \"종이 씹는 소리와 파형이 같습니다.\" 농담이 아니라 측정 결과라고 한다.",
  "\"조용한 곳은 없습니다. 무향실에 들어가면 자기 피가 도는 소리가 들립니다. 사람들은 십 분을 못 버팁니다. 저는 사십 분 있었습니다.\"",
  "\"박사님은 사실이 아닌 말을 하실 때 목소리가 반음 올라갑니다. 어제 괜찮다고 하셨을 때요.\"",

  "\"고래 소리를 십 년 들었습니다. 고래는 제 소리를 한 번도 들은 적이 없습니다. 그게 이 일입니다.\"",

  "\"어머니는 타블라를 치셨습니다. 저는 박자를 못 맞춰서 듣는 쪽으로 왔습니다. 듣는 것에는 틀리는 법이 없으니까요.\""],
 work:{gen:["생물음향학자는 손잡이를 돌리는 동안에는 대답하지 않는다. 멈추고 나서 말한다. \"축받이의 구슬 하나가 깨졌습니다. 한 바퀴에 한 번 딸깍합니다. 엿새 동안 그랬을 겁니다.\"","\"돌리는 속도를 바꾸면 선체가 따라 웁니다. 분당 쉰넷에서요. 이 배가 가진 음입니다. 그 속도는 피해서 돌리고 있습니다.\""],
  air:["\"덜컹거림이 멎기 삼 초 전에 음이 올라갑니다. 필터가 막혔다는 뜻입니다. 박사님은 그 뒤에 십 초를 더 돌리셨습니다. 매번요.\"","생물음향학자가 정제기 옆면에 귀를 대고 있다. \"숨소리 같습니다. 들숨이 길고 날숨이 짧습니다. 기계는 사람과 반대로 숨을 쉽니다.\""],

  rest:["생물음향학자가 이어폰을 끼고 눈을 감고 있다. 어깨를 두드리자 한쪽을 빼서 건넨다. 아무 소리도 나지 않는다. \"네. 아무것도 안 듣는 중입니다.\"","\"박사님 발소리는 오른쪽이 무겁습니다. 통로 끝에서부터 압니다. 저를 놀라게 하실 수는 없을 겁니다.\""]}},

 req:{intro:["균학자가 밀폐 작업함의 장갑 구멍에 손을 넣어 보고 있다.","\"살아 있는 채로 키워야 합니다. 밀폐 작업함에서요.\"","\"박사님은 표본을 죽여서 보셨죠. 그래서 못 보신 겁니다.\""],

  fx(){s.power=Math.max(0,s.power-6);s.contam+=2;s.data+=3;rec("culture");note("밀폐 작업함에서 생배양 개시. 균사는 장갑 포트의 형태를 따라 자랐다. 접근 경로를 예측하는 것으로 보인다.")},

 small:["\"수석 선발 때 박사님 발표를 들었습니다. 좋았어요. 제 것이 더 좋았지만.\"",
  "균학자가 식량을 뜯어 냄새를 맡는다. \"곰팡이도 안 슬 음식입니다. 칭찬이 아닙니다. 곰팡이가 거절한 것을 우리가 먹는 겁니다.\"",
  "\"숲의 나무들은 뿌리 밑에서 균사로 이어져 있어요. 큰 나무가 그늘의 어린 나무에게 당을 보냅니다. 정확히는, 균이 보내게 합니다.\"",
  "\"폴란드에서는 가을에 온 가족이 버섯을 따러 갑니다. 해마다 몇 명씩 죽습니다. 그래도 갑니다. 저는 여섯 살에 독버섯 열두 종을 외웠어요. 글자보다 먼저요.\"",
  "균학자가 내 일지의 오타를 고쳐 놓았다. 세 군데. 네 번째로 고친 것은 오타가 아니라 내 결론이었다.",
  "\"제가 수석이었으면 박사님을 먼저 깨웠을 겁니다. 그건 알아 두세요.\"",
  "\"세상에서 제일 큰 생물이 뭔지 아십니까. 고래가 아닙니다. 숲 밑에 깔린 버섯 한 개체예요. 구 제곱킬로미터. 박사님 교과서에는 고래라고 되어 있겠죠.\"",
  "\"개미 몸에 들어가는 균이 있습니다. 개미를 풀 꼭대기로 올려 보내고, 잎을 물게 하고, 거기서 죽게 합니다. 포자가 멀리 가는 높이예요. 개미는 끝까지 자기가 올라가고 싶어서 올라간다고 생각했을 겁니다.\" 그 말을 하고 나를 본다."],
 work:{gen:["\"박사 둘이 번갈아 손잡이를 돌리는군요. 위원회가 보면 좋아하겠습니다.\" 돌리는 것은 정확하다. 한 바퀴도 흘리지 않는다.","\"균은 이런 식으로 일하지 않습니다. 한 군데서 얻은 것을 그물 전체가 나눠 씁니다. 우리는 한 사람이 돌려서 한 배를 먹이죠. 비효율적입니다. 감상적이기도 하고요.\""],
  air:["균학자는 헌 필터를 버리지 않고 날짜순으로 펼쳐 놓았다. \"얼룩이 닷새째부터 주름의 골만 골라 자랍니다. 습기가 고이는 자리예요. 정확히는, 우리 숨이 고이는 자리입니다.\"","\"박사님은 이걸 닦아 내셨죠. 닦으면 균사가 끊깁니다. 끊긴 균사는 양쪽에서 다시 자라요. 닦을 때마다 둘로 만드신 겁니다.\" 틀렸다고 말할 근거가 없다."],
  fix:["\"제 전공은 아닙니다만, 박사님 전공도 아니죠.\" 지렛대를 잡는 손이 뜻밖에 익숙하다. 흙을 파 본 사람의 손목이다.","\"문틀 고무에 벌써 들어가 있습니다. 균사가요. 금속은 두고 고무만 먹었어요. 가릴 줄 압니다. 저는 그게 마음에 걸립니다.\""],
  rest:["균학자는 쉬지 않고 내 일지를 읽고 있다. 여백에 연필 글씨가 늘었다. \"'추정된다'를 열네 번 쓰셨어요. 그중 아홉 번은 추정이 아니라 사실입니다. 자신을 가지세요.\"","\"쉬라고 하시니 쉽니다. 균은 조건이 나쁘면 몇십 년도 쉽니다. 포자로요. 그러다 조건이 맞으면 하루 만에 일어나죠. 저는 그 정도는 못 됩니다만.\""]}},

 small:["\"출발 전 면담에서 박사님이 한 거짓말 하나를 알아요. 뭔지는 안 말할래요. 다들 하나씩은 해요. 안 한 사람이 더 걱정이에요.\"",

  "\"여덟 명의 평가서를 다 제가 썼어요. 한 줄씩 외워요. 박사님 것도요. 듣고 싶으세요?\" 잠깐 기다린다. \"아니에요. 안 듣는 게 나아요.\"",
  "\"좁은 데 오래 있으면 사람들은 남의 씹는 소리를 미워하게 돼요. 큰일로는 안 싸워요. 숟가락 놓는 소리로 싸워요. 박사님은 숟가락을 조용히 놓으시네요. 일부러죠?\"",

 work:{gen:["\"몸 쓰는 일이 제일 좋은 약이에요. 저한테도요.\" 심리학자가 돌리면서 나를 본다. \"박사님은 이걸 돌릴 때 무슨 생각 하세요? 저는 아무 생각이 안 나요. 그게 좋아요.\"","\"닷새 동안 이걸 혼자 돌리셨죠. 몇 바퀴인지 세셨어요?\" 셌다고 답한다. \"세는 사람은 버텨요. 안 세기 시작하면 말씀해 주세요.\""],
  air:["\"숨 쉬는 걸 맡기시는 거네요.\" 심리학자가 필터를 끼우며 말한다. \"누구한테 숨을 맡겨 본 적 있으세요? 여기 오기 전에요.\" 대답을 찾는 동안 정제기가 돈다.","\"박사님은 산소 수치를 자주 보세요. 저는 박사님이 보는 횟수를 봐요. 어제보다 줄었어요. 좋아지고 있어요.\""],
  fix:["\"문을 여는 건 제 일이기도 해요. 다른 종류의 문이지만.\" 심리학자가 지렛대를 누른다. \"이쪽이 쉬워요. 이 문은 열리기 싫어하지 않거든요.\"","심리학자가 문틀 앞에서 손을 멈춘다. \"이 안에 뭐가 있는지 아시죠. 아시면서 엿새 동안 안 여셨어요. 나무라는 게 아니에요. 저라도 그랬을 거예요.\""],

function talkScene(){return s.h?(s.h.second?TALKS3:TALKS).find(x=>!s.h.talked[x.id]&&x.cond()):null}
function workLine(){
  /* 일을 맡긴 뒤 말을 걸면 맡은 일에 따라 다른 말이 나온다. 일마다 두 가지. */
  if(!s.h||!s.h.up||outside())return null;
  const k=eff(),w=H().work[k];s.h.wk=s.h.wk||{};const n=s.h.wk[k]||0;
  return n<w.length?{k:k,t:w[n]}:null;
}
function smallN(){if(s.h.smDay!==s.day){s.h.smDay=s.day;s.h.smN=0}return s.h.smN}
function canTalk(){return !!s.h&&s.day>=6&&(!!talkScene()||!!workLine()||(s.h.up&&smallN()<2))}
function startTalk(){if(busy()||s.phase!=="play"||!canTalk())return;s.idle=0;hist("act",hn()+"에게 말을 건다");s.job={id:"talk",t:0,dur:10,sec:!!s.h.second};render()}
function doTalk(){
  const sc=talkScene(),w=sc?null:workLine();
  if(sc){s.h.talked[sc.id]=true;say(R(sc.lines),"",1300);s.h.trust=clamp(s.h.trust+(sc.trust||0),0,10);if(sc.fx)sc.fx()}
  else if(w){s.h.wk[w.k]=(s.h.wk[w.k]||0)+1;say([w.t],"",1100);s.h.trust=clamp(s.h.trust+.15,0,10)}
  else if(s.h.trust<3.5){s.h.smN=smallN()+1;say([hn()+"는 짧게 답하고 고개를 돌린다. 이야기할 기분이 아닌 것 같다."]);s.h.trust=clamp(s.h.trust+.1,0,10)}
  else{const p=H().small;say([p[s.h.small++%p.length]],"",1100);s.h.smN=smallN()+1;s.h.trust=clamp(s.h.trust+.15,0,10)}
  render();
}
const TASK={rest:"쉬게 한다",gen:"발전기",air:"정제기",fix:"문 수리"};
function setTask(k){if(!s.h||!s.h.up||s.h.task===k||!hHere())return;if(s.h.sulkDay===s.day&&k!=="rest"){say([hn()+"는 대답하지 않는다. 오늘은 무엇도 맡지 않을 얼굴이다."]);render();return}s.h.task=k;s.h.hT=0;s.h.self=null;s.h.idleT=k==="rest"?-50:0;hist("act",hn()+"에게 맡긴다: "+TASK[k]);
  say([{rest:hn()+"에게 쉬라고 한다. ",gen:hn()+"에게 발전기를 맡긴다. ",air:hn()+"에게 정제기와 필터를 맡긴다. ",fix:hn()+"에게 조종실 문을 맡긴다. "}[k]+H().task[k]].concat(s.h.trust<3.5&&k!=="rest"?["움직이기까지 한 박자가 걸린다. 손도 전보다 느리다."]:[]));render()}
function fixStep(who){
  s.fix++;const by=who?hn()+"가 ":"";
  if(s.fix===1)say([by+"지렛대를 문틀에 건다. 금속이 운다. 손가락 두 마디만큼 벌어진다."]);
  else if(s.fix===2)say([by+"경첩의 핀을 뽑는다. 문짝이 한쪽으로 내려앉는다. 어깨가 들어갈 틈이 생겼다."]);
  else{s.locs.push("cockpit");if(s.h.task==="fix")s.h.task="rest";say([by+"문짝을 통로 쪽으로 눕힌다.","조종실이 열렸다. 찬 공기와 흙냄새가 통로로 흘러나온다."],"",1300)}
}
function suitOff(){const back=s.h&&s.h.with&&(s.h.outN||0)>=3?[s.h.inf?hn()+"가 바깥문 앞에서 한 번 뒤를 돌아본다. 능선 쪽이다. 부르자 들어온다.":hn()+"가 나보다 먼저 바깥문 안으로 들어간다. 문이 닫히고 나서야 숨을 내쉰다."]:[];s.suitOn=false;if(s.h)s.h.with=false;s.contam+=.3;say(["기밀실 안쪽 문이 닫힌다. 선외복을 벗는다.","장화 바닥에 고운 가루가 묻어 있다. 털어도 다 떨어지지 않는다."].concat(back));if(s.sw){flip();s.sw=false}}

function echoTick(){

  if(!s.h||!s.h.up||outside()||s.spin||s.job||s.phase!=="play"||s.clock<18||s.clock-(s.echoAt||0)<24)return false;
  s.h.echo=s.h.echo||{};const e=ECHO.find(x=>x.day<=s.day&&!s.h.echo[x.id]&&x.c());
  if(!e){if(s.day>=8&&s.h.trust>=7&&!s.daily.hInit&&s.clock>70){s.daily.hInit=true;s.echoAt=s.clock;const p=H().small;say([hn()+"가 먼저 말을 걸어 온다.",p[s.h.small++%p.length]],"",1200);return true}return false}
  s.h.echo[e.id]=true;s.echoAt=s.clock;say(e.l(),"",1300);e.fx();return true;
}

function trustWatch(dt){
  /* 신뢰가 오르내리면 잠깐 화살표로 알린다 */
  const h=s.h;h.trust=clamp(h.trust,0,10);if(h.tSeen==null)h.tSeen=h.trust;
  if(Math.abs(h.trust-h.tSeen)>=.2){h.tDir=h.trust>h.tSeen?1:-1;h.tT=8;h.tSeen=h.trust;return true}
  if(h.tT>0){h.tT-=dt;if(h.tT<=0){h.tDir=0;return true}}

  let r=0;
  if(a>=0&&b<0)r=1;else if(b>=0&&a<0)r=2;
  else if(a>=0&&b>=0){const p=q<0?0:q;r=Math.abs(a-p)<=Math.abs(b-p)?1:2}

function feedLines(o,i){const n=NOUN[i],lv=o.inf?(o.infLv||0):0,a=n+"의 방문 아래 틈으로 식량 한 포를 민다.";
  o.fedDay=s.day;

  if(lv>=2){o.hunger=clamp((o.hunger==null?4:o.hunger)+3,0,10);obs(o,n+": 식량을 반만 먹었다");return [a,"한참 뒤에 포장 뜯는 소리가 난다. 느리다. 반쯤 남은 포가 문 아래로 도로 나온다.","배가 고프지 않다고 한다. 어제도 그렇게 말했다."]}
  o.hunger=clamp((o.hunger==null?4:o.hunger)+6,0,10);tadd(o,.3);
  return [a,"안쪽에서 포장 뜯는 소리가 난다. 빠르다. 배가 고팠던 것이다.","문 너머로 한마디가 온다. 고맙다는 말은 아니다. 받았다는 말이다."];
}
function skipLines(o,i){const n=NOUN[i],quiet=o.inf&&(o.infLv||0)>=4;

  return [n+"의 방문 앞에 선다. 식량은 주머니에 그대로 있다. 지나간다.",quiet?"문 안쪽에서는 아무 소리도 나지 않는다.":"문 안쪽에서 발소리가 문 쪽으로 왔다가 멈춘다. 틈으로 그림자가 보인다. 기다리는 그림자다."];
}

 f_inner:{n:"기밀실 안쪽 창",at:"hall",c:()=>!!s.copIn,l:["안쪽 문의 창은 손바닥만 하다. 이쪽 유리에 김이 서려 있다. 저쪽에서 쉬는 숨이다.","창 아래 문틈으로 재 냄새가 샌다. 그 밑에 다른 냄새가 있다. 오래 씻지 못한 사람의 냄새다.","잠금 손잡이는 이쪽에 있다. 손을 얹으면 쇠가 미지근하다. 누가 방금 잡았던 것처럼."]},
 f_cup:{n:"찬장",at:"mess",c:()=>!!s.seen.stock,l:["식당 벽 한 면이 찬장이다. 칸마다 번호가 있고, 번호마다 날짜가 있다. 날짜는 삼 년 전에서 멈춘다.","식량 포는 은색이다. 겉에 맛이 적혀 있다. 닭고기, 콩, 과일. 뜯으면 전부 같은 색이다.","빈 칸이 늘어 간다. 빈 칸의 바닥에는 먼지도 없다."]},
 f_clock:{n:"벽시계",at:"mess",c:()=>true,l:["식당 문 위의 둥근 시계다. 추락한 시각에 멈춰 있다. 초침은 떨리기만 한다.","지구 시각에 맞춘 시계다. 이 행성의 하루와는 처음부터 맞지 않았다.","유리에 금이 한 줄 가 있다. 금은 정확히 열두 시에서 시작한다."]},
 f_table:{n:"식탁",at:"mess",c:()=>true,l:["아홉 자리의 식탁이다. 바닥에 볼트로 박혀 있어서 기울기를 따라 같이 누웠다.","자리마다 컵 받침이 파여 있다. 내 자리가 어디였는지는 기억나지 않는다.","흘러내린 카드는 문 쪽 모서리에 모여 있다. 맨 위는 뒤집혀 있다. 뒤집어 보지 않는다."]},
 f_crates:{n:"화물 상자",at:"cargo",c:()=>true,l:["어른 키만 한 상자들이 넉 줄로 서 있다. 줄마다 고정 띠가 천장의 고리까지 올라간다.","띠는 손바닥 너비다. 화물 하나를 묶는 데 팔 길이의 열 배쯤 쓴다. 당기면 조금 늘었다가 돌아온다.","기울기 때문에 상자들이 전부 한쪽 띠에 기대어 있다. 띠가 삐걱거릴 때마다 상자가 머리카락만큼 움직인다."]},
 f_bulk:{n:"비상 격벽",at:"cargo",c:()=>true,l:["찢어진 외판 자리를 막은 주황색 판이다. 추락하는 동안 저절로 내려왔다.","판과 선체 사이의 이음매를 발포재가 메우고 있다. 발포재는 딱딱하게 굳었다. 그 위로 다른 것이 번져 있다.","손을 대면 격벽이 떨린다. 고르다. 저 너머에서 무엇인가 일정하게 움직인다."]},
 f_wall:{n:"표본 용기 벽",at:"lab",c:()=>true,l:["벽 한 면에 빈 용기가 줄지어 걸려 있다. 삼백 개. 줄마다 서른 개씩 열 줄.","용기마다 번호표가 달려 있다. 채집 일시, 좌표, 채집자. 전부 빈칸이다.","서른 날 동안 하루에 열 개씩 채울 계획이었다. 계획서에 그렇게 적은 사람이 나다."]},
 f_box:{n:"밀폐 작업함",at:"lab",c:()=>true,l:["유리 상자에 장갑 두 짝이 안쪽으로 달려 있다. 손을 넣으면 고무가 팔꿈치까지 올라온다.","안쪽의 기압이 바깥보다 낮게 맞춰져 있다. 새어도 안쪽으로 샌다. 그렇게 설계했다.","유리 안쪽에 지문이 하나 있다. 장갑을 끼고는 남길 수 없는 지문이다."]},
 f_pod2:{n:"빈 장치",at:"cryo",c:()=>s.day>=6&&!!s.h,l:["덮개가 열린 채 서 있는 장치다. 완충재에 사람 모양이 남아 있다. 천천히 올라오는 중이다.","옆판 안쪽에서 순환기가 돈다. 안에 사람이 없는데도 돈다. 걸러 낼 숨이 없어서 헛도는 소리다.","표시창에는 각성 완료라고 떠 있다. 그 아래 작은 글씨. 재사용 가능."]},
 f_pipes:{n:"배관 묶음",at:"cryo",c:()=>true,l:["여덟 장치에서 올라온 배관이 천장 한가운데서 굵은 다발로 묶인다. 팔로 안을 수 없는 굵기다.","다발은 벽을 뚫고 배의 등 쪽으로 간다. 어디에 닿는지는 배치도에 없다.","손을 대면 낮게 떨린다. 여덟 개의 맥이 겹친 떨림이다. 세어 보면 여덟이 아닌 것 같을 때가 있다."]},
 f_panel:{n:"계기판",at:"cockpit",c:()=>true,l:["좌석 둘 사이에서 앞유리 아래까지 이어진 판이다. 눈금이 예순 개쯤 된다.","바늘마다 붉은 띠와 초록 띠가 있다. 읽을 줄 아는 것은 고도와 연료, 그리고 시계다.","가장자리에 누가 붙인 쪽지가 있다. '이 등이 켜지면 나를 깨울 것.' 어느 등인지는 화살표가 떨어져 나가 알 수 없다."]},
 f_seatL:{n:"왼쪽 좌석",at:"cockpit",c:()=>!!s.done.k_body,l:["기장의 자리다. 등받이에 이름표가 박혀 있다. 읽지 않아도 아는 이름이다.","안전띠의 버클은 채워져 있다. 띠가 좌석을 가로질러 팽팽하다.","발판 위에 신발 자국이 둘 찍혀 있다. 삼 년 동안 한 번도 밟지 않은 발판에, 추락하던 몇 분 동안 찍힌 것이다."]},
 f_seatR:{n:"오른쪽 좌석",at:"cockpit",c:()=>!!s.done.k_seat,l:["부조종사의 자리다. 안전띠가 풀려 좌석 양옆으로 늘어져 있다.","좌석 밑에 책자가 펼쳐진 채 엎어져 있다. 비상 절차서다.","팔걸이에 손자국이 남아 있다. 꽉 쥔 자국이 아니다. 짚고 일어선 자국이다."]},
 f_suits:{n:"선외복 걸이",at:"airlock",c:()=>true,l:["벽을 따라 걸이가 열 개다. 걸이마다 번호와 치수가 적혀 있다.","선외복은 허수아비처럼 걸려 있다. 헬멧의 유리마다 이 방의 붉은 등이 하나씩 떠 있다.","빈 걸이 하나. 그 아래 바닥에 장갑 한 짝이 떨어져 있다. 급히 입은 사람의 것이다."]},
 f_outer:{n:"바깥문",at:"airlock",c:()=>true,l:["바깥문은 안쪽 문보다 두껍다. 테두리에 고무가 세 겹이다.","손바닥만 한 창으로 밖이 보인다. 재, 그리고 재 위의 밝음. 유리 바깥에 가루가 얇게 앉았다.","문 옆에 감압 손잡이가 있다. 돌리면 귀가 먹먹해진다. 그 느낌이 이 배에서 나가는 느낌이다."]},
 f_skin:{n:"외판",at:"hull",c:()=>true,l:["가까이서 보는 선체는 생각보다 거칠다. 삼 년의 먼지가 긁고 간 줄이 뱃머리에서 꼬리로 나 있다.","판과 판 사이의 이음매에 손끝을 넣는다. 들어가는 데가 있고 들어가지 않는 데가 있다.","선체 번호의 마지막 두 글자가 재에 묻혀 있다."]},
 f_noz:{n:"추진부",at:"hull",c:()=>s.day>=9,l:["꼬리 쪽에 종 모양의 노즐이 셋이다. 사람이 서서 들어갈 수 있는 크기다.","안쪽 벽은 검어야 한다. 삼 년을 태운 자리다. 은빛이다.","노즐 아래의 재는 다른 데보다 곱다. 체로 친 것처럼."]}
});

/* ── 사람이 그 자리에 있을 때 ── */
function whoLines(name){
  const out=[];
  const one=()=>{const h=s.h;if(!h||!h.up||h.locked||h.asleep||(h.with&&outside())||s.day<7)return;
    const at=hloc(),n=hn();if((at==="조종실 앞"?"통로":at)!==name)return;
    if(eveHome(h)){out.push(h.eveOdd?n+"가 창 앞에 서 있다. 유리에 닿을 만큼 가깝다. 부르면 한 박자 늦게 돌아본다.":h.task==="gen"&&!h.pause?n+"가 발전기 손잡이를 돌리고 있다. 밤이 가까운데도 박자가 흐트러지지 않는다.":n+"가 침상에 걸터앉아 있다. 신발을 벗지 않았다.");return}
    if(h.pause){out.push(h.pause==="cold"?n+"가 담요를 두르고 식탁에 앉아 있다. 손을 겨드랑이에 끼웠다.":h.pause==="hungry"?n+"가 찬장 앞에 서 있다. 열지 않는다. 열어도 제 몫이 없다는 것을 안다.":n+"가 식탁에 팔을 괴고 숨을 고른다. 어깨가 오르내린다.");return}
    if(h.task==="gen")out.push(n+"가 발전기 손잡이를 돌리고 있다. 어깨가 박자를 탄다. 내 박자와 조금 다르다.");
    else if(h.task==="air")out.push(n+"가 정제기 앞에 쪼그려 앉아 있다. 필터 서랍 하나가 열려 있다.");
    else if(h.task==="fix")out.push(n+"가 조종실 문틀에 지렛대를 걸고 있다. 쇠 우는 소리가 통로를 타고 온다.");
    else if(h.self!=null&&selfOf(h))out.push(n+"가 여기 있다. "+selfOf(h).n+" 중이다. 나를 보고 고개만 든다.");
    else out.push(n+"가 식탁에 앉아 있다. 빈손이다. 쉬라고 하면 쉬는 법을 모르는 사람처럼 앉아 있다.")};
  one();if(s.g&&s.day>=13)as2(one);
  return out;
}
[["room","선실"],["hall","통로"],["mess","식당"],["lab","실험실"],["port","관측창"],["cargo","화물칸"],["cryo","동면실"]].forEach(x=>{
  BGX.push({k:x[0],c:()=>!!s.h&&s.day>=7&&!outside()&&whoLines(x[1]).length>0,t:()=>whoLines(x[1]).join(" ")})});

X("room",()=>s.day>=18,"문틀을 따라 엷은 막이 올라와 있다. 문을 닫으면 막이 문과 틀 사이에서 눌린다. 열면 다시 선다.");

X("f_gap",()=>s.day>=6&&!!s.h,"틈에 귀를 대면 통로를 걷는 발소리가 들린다. 내 것이 아닌 발소리다. 그것이 아직 낯설다.");
X("f_bunk",()=>s.day>=6&&s.day<13&&!!s.h,"옆 침상의 모포는 반으로 접혀 있다. 베개가 벽 쪽이 아니라 문 쪽에 있다. 문을 보고 자는 사람이다.");
X("f_bunk",()=>s.day>=13&&!!s.g,"침상 셋이 나란하다. 가운데가 내 것이다. 양쪽에서 숨소리가 온다.");
X("f_bunk",()=>(s.litRun||0)>=3,"베개 위에 고운 가루가 앉아 있다. 턴다. 내일 아침에도 앉아 있을 것이다.");
X("f_win",()=>s.day>=7,"유리 가장자리에 가루가 앉았다. 안에서는 닦이지 않는다.");
X("f_win",()=>s.day>=13,"창틀의 고무를 따라 살갗 같은 것이 번져 있다. 유리와 틀의 경계가 흐리다.");
X("f_win",()=>s.day>=19,"창밖에 아무것도 붙어 있지 않다. 깨끗하다. 누가 치운 것처럼.");
X("f_lamp",()=>(s.jar||0)>=2,"용기가 둘이다. 서로 쪽으로 조금 기울어 있다. 처음 놓을 때는 반듯했다.");
X("f_lamp",()=>!!s.dim,"불을 낮추자 막이 눕는다. 용기 안쪽의 김이 걷힌다. 숨을 멈춘 것처럼.");
/* 통로 */
X("hall",()=>s.day>=6&&s.day<13&&!!s.h,"바닥의 가루에 발자국이 두 줄이다. 한 줄은 보폭이 나보다 넓다.");

X("hall",()=>(s.scrub||0)>=1,()=>s.scrub>=2?"동면실 문이 열려 있다. 문턱을 넘어온 관 둘이 천장의 환기구에 나란히 물려 있다. 찬 바람이 두 줄로 내려온다.":"동면실 문이 열려 있다. 문턱을 넘어온 관 하나가 천장의 환기구에 물려 있다. 그 아래를 지나면 목덜미가 차다.");

X("hall",()=>s.day>=17,"물 떨어지는 소리가 멎었다. 벽이 말랐다. 마른 벽이 젖은 벽보다 조용해서 귀가 허전하다.");

    c.appendChild(el("p","",j?"자동 저장 지점: "+saveLabel(j)+". 이 브라우저에 남아 있어 창을 닫아도 이어서 할 수 있습니다.":"아직 저장된 지점이 없습니다. 첫날 밤을 넘기면 생깁니다."));
    c.appendChild(el("p","","파일로 내보내면 다른 기기에서 불러올 수 있습니다. 불러오면 지금 하던 판은 그 지점으로 바뀝니다."));
    r.appendChild(btn("저장 파일 내보내기",()=>exportSave(msg),{off:!j}))}
  r.appendChild(btn("저장 파일 불러오기",()=>inp.click(),{cls:compact?"mini":""}));
  c.appendChild(r);c.appendChild(inp);c.appendChild(msg);return c;
}

/* ───────── 기록 탭, 재시작 ───────── */
function setView(v){
  view=v;const r=v==="record";if(r)flush();lastT=Date.now();
  $("tabPlay").setAttribute("aria-selected",String(!r));$("tabRec").setAttribute("aria-selected",String(r));
  $("envCol").hidden=r;$("mainCol").hidden=r;$("sideCol").hidden=r;$("record").hidden=!r;
  if(r)renderRecord();else render();
}
const ONCE=new Set(CRANK.concat(["손을 뗀다. 팔이 묵직하다.","손을 뗀다.","전력이 더는 들어가지 않는다. 축전 용량이 찼다.","다시 어두워진다. 선실의 발전기를 돌려야 한다.","발전기가 탄력을 받는다. 한 바퀴에 들어오는 양이 늘었다.","멈추면 다시 무거워질 것이다."]).concat(NUDGE).concat(AMB));
Object.keys(MOVE).forEach(k=>MOVE[k].forEach(x=>ONCE.add(x)));
Object.keys(CRANKD).forEach(k=>CRANKD[k].forEach(x=>ONCE.add(x)));
function story(){
  /* 기록을 장과 문단으로 묶는다. 되풀이되는 짧은 문장은 장마다 한 번만 남긴다. */
  const out=[];let para=[],kind="",used={};story.roles={};
  if(!s.hist.length||!/^— .+ —$/.test(s.hist[0].t))out.push({k:"ch",t:"1일차"});
  const end=()=>{if(para.length){out.push({k:kind,lines:para});para=[]}};
  s.hist.forEach(x=>{
    if(x.c==="act"){if(x.t.indexOf("발전기를")===0)return;end();const m=/^— (.+) —$/.exec(x.t);if(m){out.push({k:"ch",t:m[1]});used={}}return}
    if(x.c==="journal"){end();out.push({k:"journal",day:x.t});return}
    if(ONCE.has(x.t)){if(used[x.t])return;used[x.t]=true}
    const k=x.c==="n"||x.c===""?"n":x.c;if(k!==kind)end();kind=k;para.push(x.t);if(x.s)story.roles[x.t]=x.s});
  end();return out;
}
function renderRecord(){
  const R=$("record");R.innerHTML="";
  const a=el("div","story");a.appendChild(el("h2","","이야기"));
  if(!s.hist.length)a.appendChild(el("p","empty","아직 기록이 없습니다."));
  else story().forEach(n=>{
    if(n.k==="ch")a.appendChild(el("h3","",n.t));
    else if(n.k==="journal"){const j=s.journal.find(x=>x.day===n.day);if(j)a.appendChild(journalBox(j))}
    else if(n.k==="term"){const p=el("p","term");n.lines.forEach((l,i)=>{if(i)p.appendChild(document.createElement("br"));p.appendChild(document.createTextNode(l))});a.appendChild(p)}
    else{const p=el("p",n.k==="n"?"":n.k);quoLines(p,n.lines,story.roles);a.appendChild(p)}});
  R.appendChild(a);
  const c=el("div");c.appendChild(el("h2","","지난 판"));
  if(!runs.length)c.appendChild(el("p","empty","1막을 끝낸 판이 없습니다."));
  else{const w=el("div","runs");runs.forEach((r,i)=>{const last=r.journal[r.journal.length-1];w.appendChild(journalBox(last," · "+(runs.length-i)+"번째 판 · "+r.helper))});c.appendChild(w)}R.appendChild(c);R.appendChild(saveBox(false));
}
function restart(){if(timer){clearTimeout(timer);timer=null}queue=[];cooling=false;try{localStorage.removeItem(SAVE)}catch(e){}s=fresh();resetAsk();setView("play");prologue()}
function resetAsk(){const B=$("restartBox");B.innerHTML="";const b=btn("재시작.",askRestart);b.id="restart";B.appendChild(b)}
function askRestart(){const B=$("restartBox");B.innerHTML="<span>처음부터 다시 할까요?</span>";B.appendChild(btn("다시 시작.",restart,{cls:"danger"}));B.appendChild(btn("취소.",resetAsk))}
$("tabPlay").addEventListener("click",()=>setView("play"));
$("tabRec").addEventListener("click",()=>setView("record"));
$("restart").addEventListener("click",askRestart);

/* ───────── 프롤로그: 시작하기 전에 읽는 배경 ───────── */
const PRO=[
 ["다른 별의 생명을 보러 가는 배였다. 나는 그 배의 생물학자다.",
  "가는 동안은 동면했다. 도착하면 깨워 주기로 되어 있었다.",
  "깨워 준 사람은 없었다."]
];
function renderPrologue(N){
  const i=s.pro||0,w=el("div","story prologue");
  if(i===0){w.appendChild(el("h2","protitle","SOL. 30"))}
  PRO[i].forEach((t,k)=>{const p=el("p","",t);p.style.animationDelay=(k*1.6)+"s";w.appendChild(p)});
  N.hidden=false;N.appendChild(w);
  const r=el("div","row");
  r.appendChild(btn(i<PRO.length-1?"다음":"눈을 뜬다",()=>{if(i<PRO.length-1){s.pro=i+1;render()}else begin()},{cls:i<PRO.length-1?"":"fork"}));
  if(i<PRO.length-1)r.appendChild(btn("건너뛴다",begin,{cls:"mini"}));
  N.appendChild(r);
  if(PRO.length>1)N.appendChild(el("p","hint",(i+1)+" / "+PRO.length));
  N.appendChild(saveBox(true));
}
/* ───────── 시작 ───────── */
let saved=null;
function redrawLog(){const L=$("log");L.innerHTML="";s.log.slice().reverse().forEach(l=>{const p=el("p",l.c+(l.g?" gap":""));quo(p,l.t,l.s);p.style.animation="none";L.insertBefore(p,L.firstChild)})}
function prologue(){s.phase="prologue";s.pro=0;s.env={name:"",lines:[]};drawEnv(false);render()}
function begin(){s.phase="intro";hist("act","— 프롤로그 —");PRO.forEach(pg=>{pg.forEach(x=>s.hist.push({c:"n",t:x}));s.hist.push({c:"act",t:"·"})});hist("act","— 1일차 —");
  $("log").innerHTML="";s.env={name:"어둠",lines:["보이지 않는다."]};drawEnv(false);render();say(INTRO,"",1700,()=>{s.phase="play";render()})}
function resume(){s.job=null;s.spin=null;s.mach=null;s.pick=false;if(s.choice.f5&&s.helper==null)s.phase="pick";else if(["night","intro","dying"].includes(s.phase))s.phase="play";if(!s.dz){s.dz={};s.dzs={}}if(s.usedF==null)s.usedF=0;if(s.fix==null){s.fix=0;s.suitOn=false;s.suit=0;s.h=s.h||null;s.helper2=null;s.hT=0}s.oxy=Math.min(s.oxy,OXMAX);lastT=Date.now();redrawLog();drawEnv(false);render()}
function start(data){
  if(data&&data.s&&data.s.v===2&&data.s.phase!=="intro"){s=data.s;resume();return}
  try{const j=JSON.parse(localStorage.getItem(SAVE)||"null");if(j&&j.v===2&&(j.day>=2||j.phase==="journal"))saved=j}catch(e){}
  if(saved){s.phase="title";render();return}
  prologue();
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>{flush();return{s:s}});
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
